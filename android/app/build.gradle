apply plugin: 'com.android.application'

android {
    namespace = "com.shradhalu.sridwar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shradhalu.sridwar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Changed from false: this app's Java/Kotlin layer is a thin
            // Capacitor shell (MainActivity + the Capacitor/Cordova
            // bridge) — nearly all real app logic is the JS bundle inside
            // `dist`, which minifyEnabled/R8 never touches. Turning this
            // on only shrinks/obfuscates the small native layer, reducing
            // APK/AAB size with very low behavioural risk here, PROVIDED
            // proguard-rules.pro's existing `-keep` rules for
            // com.getcapacitor.**, org.apache.cordova.**, and
            // com.shradhalu.sridwar.** (already present in that file) stay
            // intact — they prevent R8 from stripping/renaming the classes
            // the JS<->native bridge calls via reflection. Do a full
            // release-build smoke test (login, a booking, back-button
            // behaviour) before shipping, since any native-layer change
            // deserves a real test pass even when the risk is low.
            minifyEnabled true
            // Added per Play Console's "Improve your app's memory and
            // performance with R8 optimisation" recommendation (Release
            // dashboard, v1.0.4 review) — strips unused resources
            // (images, layouts, strings) the same way minifyEnabled
            // already strips unused code. Low risk for the same reason
            // minifyEnabled is: nearly everything the app actually shows
            // lives in the JS bundle under base/assets/public, which this
            // does not touch. It only prunes native Android resources
            // (e.g. unused drawables/layouts pulled in by AndroidX/
            // Capacitor libraries) that nothing in the app references.
            // Still worth a release-build smoke test after enabling, same
            // as with minifyEnabled — confirm icons, splash screen, and
            // status bar theming all still render correctly, since those
            // are the resource types most likely to be touched.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Sridwar.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
